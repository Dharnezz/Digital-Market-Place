spring:
  application:
    name: digital-marketplace-backend

  # Default datasource: PostgreSQL (used for both local development and production).
  # The database "digitalmarketplace" must already exist; schema is managed by
  # Hibernate (ddl-auto: update). Override via DATABASE_URL (full JDBC url), or
  # via DB_HOST / DB_PORT / DB_NAME / DB_USERNAME / DB_PASSWORD individually
  # (e.g. linked from a Render managed database).
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:digitalmarketplace}}
    driver-class-name: ${DATABASE_DRIVER:org.postgresql.Driver}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: ${JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

  # Email configuration (SMTP)
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Placeholders for environment-specific / sensitive values.
# Real values must be provided via environment variables at deploy time.

app:
  jwt:
    # Production must set JWT_SECRET (>= 32 bytes for HS256). The fallback below is
    # a local-development-only secret so the app boots with spring-boot:run.
    secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-in-production-0123456789}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    # Comma-separated list of allowed browser origins (Vercel frontend + local dev).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  demo-data:
    # DemoDataInitializer seeds demo users/products on a fresh database. Keep
    # disabled (false) in production via APP_DEMO_DATA_ENABLED=false.
    enabled: ${APP_DEMO_DATA_ENABLED:true}
  name: ${APP_NAME:Digital Marketplace}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
