services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: digitalmarketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env or environment}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d digitalmarketplace"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/digitalmarketplace
      DB_USERNAME: marketplace
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env or environment}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env or environment}
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
      APP_DEMO_DATA_ENABLED: "false"
    ports:
      - "8090:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db-data: